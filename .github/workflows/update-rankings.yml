name: Update rankings data

on:
  schedule:
    - cron: '0 22 * * 4'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser fallback
        run: npx playwright install --with-deps chromium

      - name: Test data refresh protection
        run: npm test && npm run test:browser

      - name: Update rankings JSON
        run: npm run update:data

      - name: Validate complete site data
        run: npm run validate:data

      - name: Build check
        run: npm run build

      - name: Commit updated rankings
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: 'Data: update Masters Swimming rankings'
          file_pattern: public/data/rankings.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
